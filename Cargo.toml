[package]
name = "hytale-runner"
version = "0.1.0"
edition = "2024"
authors = ["GameAP Team"]
description = "Cross-platform CLI tool for running Hytale dedicated servers"
license = "MIT"
repository = "https://github.com/gameap/hytale-runner"
keywords = ["hytale", "server", "gameserver", "runner"]
categories = ["command-line-utilities", "game-development"]
rust-version = "1.85"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full", "process", "signal"] }

# HTTP client
reqwest = { version = "0.12", features = ["stream", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Progress bars
indicatif = "0.17"

# Error handling
thiserror = "2"
anyhow = "1"

# Async utilities
futures-util = "0.3"

# Cryptography
sha2 = "0.10"
hex = "0.4"

# Archive extraction
flate2 = "1"
tar = "0.4"
zip = "2"

# Directories
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OAuth2 (for server file download)
oauth2 = "4"
open = "5"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
